name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  # Build PRs too, so a broken build is caught before it reaches main.
  pull_request:
    branches:
      - main
  workflow_dispatch:

# A newer push to main supersedes an in-flight run, but never cancel a
# deploy that is already underway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: build
    # Deploy from main or from any tag, never from a pull request. Selecting
    # a tag in "Run workflow" sets github.ref to refs/tags/*, which is how
    # rollback works; a manual run against a feature branch still only builds.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gavinmeeker.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Describe this deployment
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          # Sanitised: these values are interpolated into the wrangler command.
          ref="$(printf '%s' "$REF_NAME" | sed -E 's/[^a-zA-Z0-9._\/-]+/-/g' | cut -c1-60)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            deploy
            --tag ${{ steps.meta.outputs.short }}
            --message "${{ steps.meta.outputs.ref }} @ ${{ steps.meta.outputs.short }} (run ${{ github.run_number }})"

