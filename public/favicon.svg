<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Gavin Meeker">
  <!--
    GM monogram
    The text renders in the viewer's system font, so exact letterforms vary by
    OS — all the stack's fallbacks are humanist grotesques, so the mark stays
    consistent in weight and proportion. favicon-96.png is baked at build time
    for browsers that prefer a raster icon.
  -->
  <rect width="32" height="32" rx="6.5" fill="#1d6f42"/>
  <text
    x="16"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
    font-weight="700"
    font-size="15"
    letter-spacing="-0.9"
    fill="#ffffff"
  >GM</text>
</svg>
